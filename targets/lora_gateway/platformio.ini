; ONA LoRa gateway: ESP32 + Ra-02 on the ONA PC's USB. lm_link frames on both sides.
[env:gateway]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600
build_flags = -I../../libs/lm_embedded -I../../contracts/generated/c
build_src_filter = +<*>
    +<../../../libs/lm_embedded/lm_link.c>
    +<../../../libs/lm_embedded/lm_lora_sx127x.c>
    +<../../../libs/lm_embedded/lm_slots.c>
    +<../../../libs/lm_embedded/lm_link_uart.c>
