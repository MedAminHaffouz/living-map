[env:beacon]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_flags = -I../../libs/lm_embedded -I../../contracts/generated/c -DBEACON_ID=0
build_src_filter = +<*> +<../../../libs/lm_embedded/lm_link.c> +<../../../libs/lm_embedded/lm_aging.c>
; flash each beacon with its own id:  pio run -e beacon -t upload --project-option="build_flags=... -DBEACON_ID=3"
