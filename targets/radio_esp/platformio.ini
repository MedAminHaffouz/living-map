; One firmware, three uses: Writer antenna (Pi USB), Executor antenna (STM UART), ONA gateway (PC USB).
[env]
platform = espressif32
framework = arduino
monitor_speed = 921600
build_flags = -I../../libs/lm_embedded -I../../contracts/generated/c
build_src_filter = +<*> +<../../../libs/lm_embedded/lm_link.c>

[env:writer]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DLM_ROLE=1

[env:executor]
board = esp32dev
build_flags = ${env.build_flags} -DLM_ROLE=2

[env:ona]
board = esp32dev
build_flags = ${env.build_flags} -DLM_ROLE=3
