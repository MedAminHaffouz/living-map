; Living Map beacon: ESP32-C3 + Ra-02. Flash each beacon with its own id:
;   pio run -e beacon -t upload --project-option="build_flags=${common.build_flags} -DBEACON_ID=3"
[common]
build_flags = -I../../libs/lm_embedded -I../../contracts/generated/c

[env:beacon]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_flags = ${common.build_flags} -DBEACON_ID=0
build_src_filter = +<*>
    +<../../../libs/lm_embedded/lm_link.c>
    +<../../../libs/lm_embedded/lm_lora_sx127x.c>
    +<../../../libs/lm_embedded/lm_slots.c>
    +<../../../libs/lm_embedded/lm_beacon_core.c>
